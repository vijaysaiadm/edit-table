[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edit-table"
version = "0.1.0"
description = "Agentic film-editing screenplay analysis — lead agent + parallel scene workers, genre specialists and utility workers"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.30",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-dotenv>=1.0",
    "pypdf>=4.0",
]

[project.scripts]
edit-table = "edit_table.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
